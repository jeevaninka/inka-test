<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="InkaTest logo">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14C8B0"/>
      <stop offset="1" stop-color="#1493F7"/>
    </linearGradient>
    <linearGradient id="ring" x1="0.1" y1="1" x2="0.9" y2="0">
      <stop offset="0" stop-color="#4DFFE3"/>
      <stop offset="1" stop-color="#C4FFF6"/>
    </linearGradient>
    <linearGradient id="tick" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#6BFFE9"/>
      <stop offset="1" stop-color="#FFFFFF"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#00355E" flood-opacity="0.28"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#tile)"/>
  <!-- dotted run track -->
  <circle cx="254" cy="254" r="82" fill="none" stroke="#A6FFF2" stroke-opacity="0.9" stroke-width="8" stroke-linecap="round" stroke-dasharray="0 21.46"/>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#soft)">
    <!-- ring, thicker (34) with the opening for the tick -->
    <path d="M370 212 A130 130 0 1 1 322 143" stroke="url(#ring)" stroke-width="34"/>
    <!-- checkmark -->
    <path d="M196 257 L236 298 L372 156" stroke="url(#tick)" stroke-width="30"/>
  </g>
</svg>
